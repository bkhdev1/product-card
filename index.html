<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
  <title>Document</title>
</head>
<body>
  <main class="title-wrapper background">
    <h1 class="title__text">Выбери свой продукт</h1>
    <div class="buttons">
      <button id="recolor-first-card-button">Перекрасить фон первой карточки</button>
      <button id="recolor-all-product-cards-button">Перекрасить фон всех карточек</button>
      <button id="open-google-button">Открыть Google</button>
      <button class="recolor-button">Изменить цвет</button>
    </div>
    <div class="product-card-wrapper">
      <div id="product-list">
        <template id="product-template">
          <div class="product-card">
            <img class="product-card__img" alt="">
            <p class="product-card__for-skin"></p>
            <h3 class="product-card__title"></h3>
            <p class="product-card__descr"></p>
            <span class="product-card__text">Состав</span>
            <ul class="product-card__composition"></ul>
            <div class="product-card__price-wrapper">
              <span class="product-card__price-text">Цена:</span>
              <span class="product-card_price"></span>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>
    <footer class="shop-footer">
    <div class="footer-container">
      <div>
        <h2 class="footer-title">Product Cards</h2>
        <p class="footer-subtitle">У нас самые лучшие продукты для кожи!</p>
        <div class="footer-social">
          <img src="/vk-icon.png" alt="Telegram" class="footer-social__icon">
          <img src="/tg-icon.png" alt="VK" class="footer-social__icon">
        </div>
      </div>
      <p class="footer-center-text">Подпишись на наши акции:</p>
      <form class="footer-subscribe-box" id="subscribe-form">
        <input type="email" name="email" class="subscribe-input" placeholder="Введите почту" required>
        <button type="submit" class="footer-button">Подписаться</button>
      </form>
      <nav class="footer-nav">
        <a href="#" class="footer-nav__main">Быстрые ссылки</a>
        <div class="footer-nav__links">
          <a href="#" class="footer-link">Главная</a>
          <a href="#" class="footer-link">Магазин</a>
          <a href="#" class="footer-link">Контакты</a>
        </div>
      </nav>   
    </div>
    <p class="footer-site">www.product-cards.com©all right reserve</p>
  </footer>

  <button id="register-btn">Регистрация</button>
  <div class="overlay"></div>
   
  <div class="modal">
    <div class="modal__content">
      <button class="modal__close" type="button">x</button>
      <h2 class="registration-title">Регистрация</h2>
      <form class="registration-form" id="reg-form">
        <label for="firstName">Имя</label>
        <input id="firstName" name="firstName" placeholder="Введите имя" required>

        <label for="lastName">Фамилия</label>
        <input id="lastName" name="lastName" placeholder="Введите фамилию" required>

        <label for="birthDate">Дата рождения</label>
        <input id="birthDate" name="birthDate" type="date" required>

        <label for="login">Логин</label>
        <input id="login" type="email" name="login" required minlength="5">

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required minlength="6">

        <label for="repeatPassword">Повтор пароля</label>
        <input id="repeatPassword" name="repeatPassword" type="password" required minlength="6">

        <button type="submit">Зарегистрироваться</button>
      </form>
    </div>
  </div>
  <script src="./script.js"></script>
  <script src="./homework-5.js"></script>
  <script src="./homework-6.js"></script>
  <script src="./homework-7.js" type="module"></script>
  <script src="./homework-8.js" type="module"></script>
</body>
</html>
